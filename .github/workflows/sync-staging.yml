name: Sync from Dashboard (Staging)

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard-state-staging.json'

concurrency:
  group: dashboard-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Copy assets into staging
        run: |
          mkdir -p staging/assets
          cp -r assets/* staging/assets/
      
      - name: Run sync script (staging)
        run: python3 sync_from_dashboard.py dashboard-state-staging.json --write-uploads --output-dir staging
      
      - name: Commit changes
        run: |
          git config user.name "Andreas Krings"
          git config user.email "dashboard@andreaskrings.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Dashboard (staging): sync works, schedule & photos"
            git pull --rebase origin main && git push
          fi
